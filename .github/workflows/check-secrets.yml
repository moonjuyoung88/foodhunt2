name: check-secrets

# 서명용 Secrets가 이 레포의 Actions에서 보이는지 이름만 확인합니다 (값은 출력하지 않습니다).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-secrets.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List secret names visible to this workflow
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          echo "visible secret names:"
          echo "$ALL_SECRETS" | jq -r 'keys[]' | sed 's/^/  - /'
          missing=0
          for n in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            len=$(echo "$ALL_SECRETS" | jq -r --arg n "$n" '.[$n] // "" | length')
            if [ "$len" -gt 0 ]; then echo "OK      $n ($len chars)"; else echo "MISSING $n"; missing=1; fi
          done
          exit $missing

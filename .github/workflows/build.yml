name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.32.8'

permissions:
  contents: write

jobs:
  apk:
    name: Test & build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 서명용 Secrets가 등록돼 있는지 (값은 출력하지 않고 유무만) 알려 줍니다.
      - name: Check signing secrets
        env:
          S1: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          S2: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          S3: ${{ secrets.ANDROID_KEY_ALIAS }}
          S4: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for pair in "ANDROID_KEYSTORE_BASE64:$S1" "ANDROID_KEYSTORE_PASSWORD:$S2" "ANDROID_KEY_ALIAS:$S3" "ANDROID_KEY_PASSWORD:$S4"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -n "$value" ]; then echo "secret $name: present (${#value} chars)"; else echo "secret $name: MISSING"; fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # 저장소 Secrets에 키스토어를 넣어 두면 그 키로 서명합니다 (없으면 디버그 키).
      - name: Prepare keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk pixel-nibblers.apk

      # 어떤 키로 서명됐는지 로그에 남깁니다 (업데이트 호환 여부 확인용).
      - name: Show signing certificate
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs pixel-nibblers.apk | grep -E "DN|SHA-256"
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then echo "signed-with: release keystore"; else echo "signed-with: debug key"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-nibblers-apk
          path: pixel-nibblers.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 픽셀 냠냠 빌드 ${{ github.run_number }}
          body: |
            `pixel-nibblers.apk` 를 내려받아 안드로이드 기기에 설치하세요.
            커밋: ${{ github.sha }}
          files: pixel-nibblers.apk
          make_latest: true
